name: Bug
description: Reportar um problema
labels: [bug]
body:
  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      placeholder: |
        1. Abrir ...
        2. Clicar em ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Comportamento atual
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navegador e versão
      placeholder: Chrome 130, Safari iOS 18
    validations:
      required: true
